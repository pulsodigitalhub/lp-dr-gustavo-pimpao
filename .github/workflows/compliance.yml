# Este arquivo é um template: copie-o para .github/workflows/compliance.yml no repo da LP do cliente e substitua https://drgustavopimpaoortopedia.com.br (domínio de produção real, com https) e main (branch de produção do repo, geralmente main) ao copiar.

name: Compliance Google Ads

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm ci
      # O checker roda sobre dist/ quando existe; sem build ele varre a raiz, onde
      # as rotas geradas pelo vite.config.js nao existem, e acusa B4 no sitemap.
      - name: Build (pra checar o output real que vai pro ar)
        run: npm run build
      - name: Checar compliance Google Ads
        env:
          COMPLIANCE_BASE_URL: "https://drgustavopimpaoortopedia.com.br"
        run: node scripts/check-google-ads-compliance.mjs

# O job falha (exit 1) em violações bloqueantes e impede o merge/publicação.
